name: Build and Release UTF-9-SAMPLIFIED Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        drumkit: [standard, 808, 909, hiphop, industrial, experimental]
        # Full FQBNs, so a non-arduino vendor (lgt8fx) can sit in the same matrix.
        # clock_div=2 runs the LGT8F328P's internal 32 MHz RC at 16 MHz, matching
        # the Nano - the sketch derives OCR2A from F_CPU either way, but running
        # at 16 MHz also keeps the loop-counted button hold times identical.
        board:
          - arduino:avr:nano
          - arduino:avr:nano:cpu=atmega328old
          - lgt8fx:avr:328:clock_div=2
        include:
          - board: arduino:avr:nano
            boardpath: nano
            boardname: Nano
          - board: arduino:avr:nano:cpu=atmega328old
            boardpath: nanoOldBootloader
            boardname: Nano (Old Bootloader)
          - board: lgt8fx:avr:328:clock_div=2
            boardpath: lgt8f328p
            boardname: LGT8F328P
        exclude:
          # The LGT8F bootloader reserves 3 KB, leaving 29696 bytes against the
          # Nano's 30720. The standard kit's sample set builds to 30658, so it
          # is the one drumkit that cannot fit - it stays Nano-only.
          - drumkit: standard
            board: lgt8fx:avr:328:clock_div=2

    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install Arduino platform and libraries
        run: |
          arduino-cli config init
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install arduino:avr

          # Install required libraries
          # MIDI library from FortySevenEffects
          arduino-cli lib install "MIDI Library"
          arduino-cli lib install Bounce2

      - name: Install LGT8F328P platform
        if: startsWith(matrix.board, 'lgt8fx:')
        run: |
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/dbuezas/lgt8fx/master/package_lgt8fx_index.json
          arduino-cli core update-index
          arduino-cli core install lgt8fx:avr@2.0.7

      - name: Compile firmware for ${{ matrix.drumkit }} - ${{ matrix.boardname }}
        run: |
          SKETCH_DIR="firmware/${{ matrix.drumkit }}"

          # Compile the sketch
          arduino-cli compile -v -b ${{ matrix.board }} "${SKETCH_DIR}" -e --output-dir=./build/${{ matrix.boardpath }}

          # Create release directory
          mkdir -p ./release

          # Copy hex file with descriptive name
          cp "./build/${{ matrix.boardpath }}/${{ matrix.drumkit }}.ino.hex" "./release/UTF9_${{ matrix.drumkit }}.${{ matrix.boardpath }}.hex"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UTF9_${{ matrix.drumkit }}.${{ matrix.boardpath }}
          path: ./release/*.hex
          retention-days: 90

      - name: Upload firmware to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/*.hex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
